name: Key Pickup Reminder

on:
  # GitHub Actionsのscheduleがこのアカウントで機能していない(数時間遅延/不発火。
  # GitHub Community Discussion #207346で報告済み)ことを確認したため、定期実行は
  # Google Apps Script側(iyokora-key-scheduler リポジトリ参照)に移行した。
  # 壊れたscheduleを残すとGAS側の正常な実行と重複通知が起きるため、
  # 修正を確認できるまでworkflow_dispatchのみとする。
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - run: dotnet restore

      - run: dotnet build --configuration Release --no-restore

      - run: dotnet test --configuration Release --no-build

  notify:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - run: dotnet restore

      - name: Run notification job
        run: dotnet run --project IyokoraKeyBorrowNotificationJob/IyokoraKeyBorrowNotificationJob.csproj --configuration Release
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
